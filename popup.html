<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>京大PandA MFA自動入力</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>京大PandA MFA自動入力</h1>
  </header>

  <main>
    <section class="provider">
      <label class="label-block">メールプロバイダ</label>
      <div class="seg">
        <label><input type="radio" name="provider" value="gmail" /> Gmail</label>
        <label><input type="radio" name="provider" value="outlook" /> Outlook</label>
      </div>
    </section>

    <section class="status">
      <div class="row">
        <span class="label">認証状態</span>
        <span id="authStatus" class="value">確認中…</span>
      </div>
      <div class="row">
        <span class="label">最終結果</span>
        <span id="lastResult" class="value">-</span>
      </div>
    </section>

    <section class="controls">
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" />
        <span>自動入力を有効にする</span>
      </label>

      <button id="signInBtn" class="primary">サインイン</button>
      <button id="signOutBtn" class="ghost">サインアウト</button>
      <button id="manualBtn" class="secondary">このタブで手動実行</button>
    </section>

    <section class="config">
      <details>
        <summary>詳細設定</summary>

        <!-- Outlook 限定 -->
        <div id="outlookConfig" class="provider-config" hidden>
          <label>
            Outlook Client ID (Azure で取得)
            <input type="text" id="outlookClientId" placeholder="11111111-2222-3333-4444-555555555555" />
          </label>
          <label>
            送信元アドレスで絞り込む
            <input type="text" id="outlookSenderFilter" />
          </label>
          <label>
            検索クエリ (件名のキーワード)
            <input type="text" id="outlookQuery" />
          </label>
        </div>

        <!-- Gmail 限定 -->
        <div id="gmailConfig" class="provider-config" hidden>
          <label>
            送信元アドレスで絞り込む
            <input type="text" id="gmailSenderFilter" />
          </label>
          <label>
            Gmail検索クエリ
            <input type="text" id="gmailQuery" />
          </label>
        </div>

        <button id="saveConfigBtn" class="secondary">保存</button>
        <p class="hint" id="redirectHint"></p>
      </details>
    </section>

    <section class="log">
      <h2>ログ</h2>
      <pre id="logArea"></pre>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
